name: ProbeGHCR
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 探测：新包名能否推送 + 多架构
        run: |
          mkdir -p /tmp/p && printf 'FROM scratch\nCOPY f /f\n' > /tmp/p/Dockerfile && touch /tmp/p/f
          echo "--- 新包名 wb-probe ---"
          docker buildx build --platform linux/amd64,linux/arm64 --push -t ghcr.io/jinsfoni/wb-probe:t1 /tmp/p && echo "PROBE_NEW_OK" || echo "PROBE_NEW_FAIL"
          echo "--- 已存在包名 workbuddy-manager ---"
          docker buildx build --platform linux/amd64,linux/arm64 --push -t ghcr.io/jinsfoni/workbuddy-manager:probe /tmp/p && echo "PROBE_EXISTING_OK" || echo "PROBE_EXISTING_FAIL"
